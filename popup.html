<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 220px;
        background: #16181d;
        color: #e7e6e3;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .title {
        font-weight: 600;
        color: #cfd3da;
      }
      button {
        appearance: none;
        border: 1px solid #383d48;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      button.on {
        background: #23262e;
        color: #4ade80;
      }
      button.on:hover {
        background: #2b2f39;
      }
      button.off {
        background: #23262e;
        color: #868c98;
      }
      button.off:hover {
        background: #2b2f39;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">Odoo.sh Dark Mode</div>
      <button id="toggle"></button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
